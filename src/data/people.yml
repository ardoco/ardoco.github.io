# `author` joins into authors.yml (build-checked), which supplies name + ORCID.
# `surnames` is how a BibTeX author is matched back to a person; Sophie Corallo
# published under Schulz before, which _data/coauthors.yml handled as a separate
# entry pointing at the same anchor.

